name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # lxml 是 HTML 解析的硬依赖（scripts/normalize.py、scripts/adapters/generic.py 都 import）
      # pypdf 是兜底 PDF 解析器，装不上也不影响
      - name: 依赖
        run: pip install lxml pypdf

      - name: 编译注册表
        run: python scripts/build_registry.py

      - name: 生成站点
        run: python scripts/build_site.py

      - name: 测试
        run: |
          set +e
          python tests/run_tests.py 2>&1 | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          {
            echo '### 测试输出'
            echo '```'
            cat test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT_CODE
