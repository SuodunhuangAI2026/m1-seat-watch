name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 编译注册表
        run: python scripts/build_registry.py
      - name: 生成站点
        run: python scripts/build_site.py
      - name: 契约测试
        run: python tests/run_tests.py
