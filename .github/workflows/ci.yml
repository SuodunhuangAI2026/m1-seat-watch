name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 可选增强：有 pypdf 时，内置解析器抽不出内容就由它兜底。
      # 装不上也不影响：核心逻辑零第三方依赖。
      - name: 可选依赖
        run: pip install pypdf || echo "pypdf 未安装，使用内置解析器"

      - name: 编译注册表
        run: python scripts/build_registry.py

      - name: 生成站点
        run: python scripts/build_site.py

      - name: 测试
        run: |
          set +e
          python tests/run_tests.py 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> test-output.txt
          set -e
          # 把输出留在仓库里，方便诊断（不需要 admin 权限就能看）
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add test-output.txt
            git commit -m "chore(ci): 测试输出" || true
            git push || true
          fi
          # 失败时把内容也打到 job summary
          {
            echo '### 测试输出'
            echo '```'
            cat test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $(grep -oP 'exit_code=\K\d+' test-output.txt | tail -1)
