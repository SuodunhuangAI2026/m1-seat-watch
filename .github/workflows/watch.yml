name: watch

on:
  schedule:
    # 每 15 分钟唤醒一次，是否真的执行由 data/schedule.json 决定
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # lxml 是 HTML 解析硬依赖（normalize.py / adapters/generic.py），pypdf 是 PDF 兜底
      - name: 依赖
        run: pip install lxml pypdf

      # 上次运行日期存缓存，避免每天产生一条「今天没变化」的空提交
      - uses: actions/cache@v4
        with:
          path: data/.state
          key: last-run-${{ github.run_id }}
          restore-keys: |
            last-run-

      # 探测单独一步：用操作系统级 timeout 强杀，避免慢速站点把整条流水线挂死。
      # --probe-only 只探测不建站；即使被强杀，health.json 已逐族增量落盘。
      # 退出码 124 = 被 timeout 杀掉，属于预期，不算失败，继续往下建站。
      - name: 探测
        id: probe
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            timeout --signal=KILL 1600 python run.py --now --probe-only || {
              rc=$?
              if [ "$rc" = "124" ] || [ "$rc" = "137" ]; then
                echo "::warning::探测超过 26 分钟被强制结束，按已抓到的部分继续建站"
              else
                echo "::error::探测异常退出（$rc）"
                exit $rc
              fi
            }
          else
            timeout --signal=KILL 1600 python run.py --scheduled --probe-only || {
              rc=$?
              if [ "$rc" = "124" ] || [ "$rc" = "137" ]; then
                echo "::warning::探测超过 26 分钟被强制结束，按已抓到的部分继续建站"
              else
                echo "::error::探测异常退出（$rc）"
                exit $rc
              fi
            }
          fi

      # 无论如何都重建站点：用已落盘的 health.json 和正文生成静态页
      - name: 生成站点
        run: python scripts/build_site.py

      - name: 提交变更
        if: steps.probe.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "无文件变化，不提交"
            exit 0
          fi
          git add -A
          git commit -m "chore(auto): $(date -u +%F) 更新"
          git push
